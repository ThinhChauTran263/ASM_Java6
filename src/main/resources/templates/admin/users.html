<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Manage Users')}"></head>
<body class="bg-surface min-h-screen">

<!-- Admin Navigation -->
<header class="fixed top-0 w-full z-50 bg-slate-900 shadow-lg">
<nav class="flex justify-between items-center w-full px-8 py-4 max-w-[1440px] mx-auto">
    <div class="flex items-center gap-8">
        <a class="text-xl font-extrabold tracking-tighter text-white font-headline" th:href="@{/admin/dashboard}">
            <span class="material-symbols-outlined align-middle mr-1">admin_panel_settings</span>
            Admin Panel
        </a>
        <div class="hidden md:flex gap-6 text-sm font-medium">
            <a class="text-slate-300 hover:text-white transition-colors" th:href="@{/admin/dashboard}">Dashboard</a>
            <a class="text-white border-b-2 border-white pb-1" th:href="@{/admin/users}">Users</a>
            <a class="text-slate-300 hover:text-white transition-colors" th:href="@{/admin/products}">Products</a>
            <a class="text-slate-300 hover:text-white transition-colors" th:href="@{/admin/orders}">Orders</a>
        </div>
    </div>
    <div class="flex items-center gap-4">
        <a th:href="@{/home}" class="text-sm text-slate-300 hover:text-white transition-colors">
            <span class="material-symbols-outlined align-middle mr-1">storefront</span>View Store
        </a>
        <form th:action="@{/logout}" method="post" class="inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="text-sm text-slate-300 hover:text-red-400 transition-colors">
                <span class="material-symbols-outlined align-middle mr-1">logout</span>Logout
            </button>
        </form>
    </div>
</nav>
</header>

<main class="pt-24 pb-12 px-8 max-w-7xl mx-auto">
    <h1 class="text-3xl font-extrabold text-slate-900 font-headline mb-8">Manage Users</h1>

    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <table class="w-full text-sm">
            <thead class="bg-slate-50 border-b border-slate-200">
                <tr>
                    <th class="px-6 py-3 text-left font-semibold text-slate-600">ID</th>
                    <th class="px-6 py-3 text-left font-semibold text-slate-600">Full Name</th>
                    <th class="px-6 py-3 text-left font-semibold text-slate-600">Email</th>
                    <th class="px-6 py-3 text-left font-semibold text-slate-600">Phone</th>
                    <th class="px-6 py-3 text-left font-semibold text-slate-600">Provider</th>
                    <th class="px-6 py-3 text-left font-semibold text-slate-600">Role</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
                <tr th:each="user : ${users}" class="hover:bg-slate-50 transition-colors">
                    <td class="px-6 py-4 text-slate-500" th:text="${user.id}"></td>
                    <td class="px-6 py-4 font-medium text-slate-900" th:text="${user.fullName}"></td>
                    <td class="px-6 py-4 text-slate-600" th:text="${user.email}"></td>
                    <td class="px-6 py-4 text-slate-600" th:text="${user.phone ?: 'N/A'}"></td>
                    <td class="px-6 py-4">
                        <span th:if="${user.provider != null}" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800" th:text="${user.provider}"></span>
                        <span th:if="${user.provider == null}" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-slate-100 text-slate-600">local</span>
                    </td>
                    <td class="px-6 py-4">
                        <span th:if="${user.role.name() == 'ADMIN'}" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-800">ADMIN</span>
                        <span th:if="${user.role.name() == 'USER'}" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">USER</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>

</body>
</html>
