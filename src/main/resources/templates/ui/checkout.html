<!DOCTYPE html>
<html class="light" lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Thanh toán')}"></head>
<body class="bg-background text-on-background antialiased">
<header th:replace="~{fragments/layout :: header}"></header>
<main class="pt-32 pb-24 px-8 max-w-[1440px] mx-auto">
<header class="mb-16">
<h1 class="text-4xl font-extrabold tracking-tight text-on-surface mb-2">Thanh toán</h1>
<p class="text-on-surface-variant font-body">Kiểm tra đơn hàng và cung cấp thông tin giao hàng.</p>
</header>
<!-- Global Validation Errors -->
<div th:if="${#fields.hasErrors('*')}" class="mb-8 p-4 bg-error-container rounded-xl">
<p class="text-on-error-container font-bold mb-2">Vui lòng kiểm tra lại thông tin:</p>
<ul class="list-disc list-inside text-on-error-container text-sm">
<li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
</ul>
</div>
<form th:action="@{/checkout}" th:object="${checkoutRequest}" method="post">
<div class="grid grid-cols-1 lg:grid-cols-12 gap-16">
<!-- Left Column: Shipping & Payment -->
<div class="lg:col-span-7 space-y-12">
<!-- Shipping Section -->
<section>
<div class="flex items-center gap-3 mb-8">
<span class="w-8 h-8 rounded-full bg-primary-fixed text-on-primary-fixed-variant flex items-center justify-center font-bold text-sm">1</span>
<h2 class="text-2xl font-bold tracking-tight">Thông tin giao hàng</h2>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="space-y-2">
<label class="text-xs font-bold uppercase tracking-wider text-on-surface-variant ml-1">Họ và tên</label>
<input th:field="*{fullName}" class="w-full bg-surface-container-high border-none rounded-DEFAULT px-4 py-3 focus:ring-2 focus:ring-primary/40 transition-all placeholder:text-outline-variant" placeholder="Nguyễn Văn A" type="text"/>
<p th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="text-error text-xs mt-1"></p>
</div>
<div class="space-y-2">
<label class="text-xs font-bold uppercase tracking-wider text-on-surface-variant ml-1">Số điện thoại</label>
<input th:field="*{phone}" class="w-full bg-surface-container-high border-none rounded-DEFAULT px-4 py-3 focus:ring-2 focus:ring-primary/40 transition-all placeholder:text-outline-variant" placeholder="+84 000 000 000" type="tel"/>
<p th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="text-error text-xs mt-1"></p>
</div>
<div class="md:col-span-2 space-y-2">
<label class="text-xs font-bold uppercase tracking-wider text-on-surface-variant ml-1">Email</label>
<input th:field="*{email}" class="w-full bg-surface-container-high border-none rounded-DEFAULT px-4 py-3 focus:ring-2 focus:ring-primary/40 transition-all placeholder:text-outline-variant" placeholder="email@example.com" type="email"/>
<p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-error text-xs mt-1"></p>
</div>
<div class="md:col-span-2 space-y-2">
<label class="text-xs font-bold uppercase tracking-wider text-on-surface-variant ml-1">Địa chỉ giao hàng</label>
<textarea th:field="*{address}" class="w-full bg-surface-container-high border-none rounded-DEFAULT px-4 py-3 focus:ring-2 focus:ring-primary/40 transition-all placeholder:text-outline-variant" placeholder="Số nhà, đường, phường/xã, quận/huyện, tỉnh/thành..." rows="3"></textarea>
<p th:if="${#fields.hasErrors('address')}" th:errors="*{address}" class="text-error text-xs mt-1"></p>
</div>
</div>
</section>
<!-- Payment Section -->
<section>
<div class="flex items-center gap-3 mb-8">
<span class="w-8 h-8 rounded-full bg-primary-fixed text-on-primary-fixed-variant flex items-center justify-center font-bold text-sm">2</span>
<h2 class="text-2xl font-bold tracking-tight">Phương thức thanh toán</h2>
</div>
<div class="grid grid-cols-1 md:grid-cols-3 gap-4">
<label th:each="pm : ${paymentMethods}" class="relative flex flex-col p-6 rounded-xl bg-surface-container-lowest cursor-pointer group hover:bg-white transition-all shadow-sm ring-1 ring-outline-variant/10 has-[:checked]:ring-primary has-[:checked]:bg-primary-fixed/10">
<input th:field="*{paymentMethod}" th:value="${pm}" class="absolute top-4 right-4 text-primary focus:ring-primary" type="radio"/>
<span class="material-symbols-outlined mb-4" th:classappend="${pmStat.first} ? 'text-primary' : 'text-secondary'" data-icon="payments">
<th:block th:switch="${pm.name()}">
<th:block th:case="'CARD'">credit_card</th:block>
<th:block th:case="'COD'">payments</th:block>
<th:block th:case="'BANK'">account_balance</th:block>
</th:block>
</span>
<span class="font-bold text-sm" th:text="${pm.displayName}">Payment</span>
</label>
</div>
<p th:if="${#fields.hasErrors('paymentMethod')}" th:errors="*{paymentMethod}" class="text-error text-xs mt-2"></p>
<!-- Discount Code -->
<div class="mt-8 space-y-2">
<label class="text-xs font-bold uppercase tracking-wider text-on-surface-variant ml-1">Mã giảm giá (tuỳ chọn)</label>
<input th:field="*{discountCode}" class="w-full bg-surface-container-high border-none rounded-DEFAULT px-4 py-3 focus:ring-2 focus:ring-primary/40 transition-all placeholder:text-outline-variant" placeholder="Nhập mã giảm giá..." type="text"/>
</div>
</section>
</div>
<!-- Right Column: Order Summary -->
<div class="lg:col-span-5">
<div class="sticky top-32 p-8 rounded-xl bg-surface-container-lowest shadow-[0_20px_40px_rgba(25,28,30,0.06)] space-y-8">
<h2 class="text-2xl font-bold tracking-tight">Tóm tắt đơn hàng</h2>
<!-- Item List -->
<div class="space-y-6">
<div th:each="item : ${cartItems}" class="flex gap-4">
<div class="w-20 h-24 bg-surface-container rounded-lg overflow-hidden flex-shrink-0">
<img class="w-full h-full object-cover" th:src="${item.productImage}" th:alt="${item.productName}"/>
</div>
<div class="flex-grow flex flex-col justify-between py-1">
<div>
<h3 class="font-bold text-sm leading-tight text-on-surface" th:text="${item.productName}">Product</h3>
<p class="text-xs text-on-surface-variant mt-1">
<span th:if="${item.size != null}" th:text="'Size: ' + ${item.size}"></span>
<span th:if="${item.size != null and item.color != null}"> &bull; </span>
<span th:if="${item.color != null}" th:text="'Color: ' + ${item.color}"></span>
<span th:text="' x ' + ${item.quantity}"></span>
</p>
</div>
<span class="font-bold text-primary text-sm" th:text="${#numbers.formatDecimal(item.subtotal, 0, 'COMMA', 0, 'POINT')} + ' VND'">0 VND</span>
</div>
</div>
</div>
<!-- Totals -->
<div class="space-y-3 pt-6 border-t border-surface-variant">
<div class="flex justify-between text-sm text-on-surface-variant">
<span>Tạm tính</span>
<span th:text="${#numbers.formatDecimal(cartTotal, 0, 'COMMA', 0, 'POINT')} + ' VND'">0 VND</span>
</div>
<div class="flex justify-between text-sm text-on-surface-variant">
<span>Phí vận chuyển</span>
<span class="text-primary font-bold">Miễn phí</span>
</div>
<div class="flex justify-between items-center pt-4 border-t border-surface-variant">
<span class="text-lg font-bold">Tổng cộng</span>
<span class="text-2xl font-black text-primary" th:text="${#numbers.formatDecimal(cartTotal, 0, 'COMMA', 0, 'POINT')} + ' VND'">0 VND</span>
</div>
</div>
<button type="submit" class="w-full py-5 bg-primary text-white rounded-xl text-lg font-extrabold tracking-tight hover:bg-primary-container transition-all scale-95 active:scale-90 shadow-lg shadow-primary/20 flex items-center justify-center">
                        Đặt hàng ngay
                    </button>
<div class="flex items-center justify-center gap-2 text-xs text-on-surface-variant opacity-60">
<span class="material-symbols-outlined text-sm" data-icon="lock">lock</span>
<span>Thanh toán an toàn với SSL</span>
</div>
</div>
</div>
</div>
</form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body></html>
