<!DOCTYPE html>
<html class="light" lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Hồ sơ cá nhân')}"></head>
<body class="bg-surface text-on-surface font-body antialiased">
<header th:replace="~{fragments/layout :: header}"></header>
<main class="pt-32 pb-24 px-8 max-w-[1440px] mx-auto min-h-screen">
<div class="max-w-2xl mx-auto">
<header class="mb-12">
<h1 class="text-4xl font-extrabold font-headline tracking-tight text-on-surface">Hồ sơ cá nhân</h1>
<p class="text-on-surface-variant mt-2">Quản lý thông tin tài khoản của bạn.</p>
</header>

<!-- Flash Messages -->
<div th:replace="~{fragments/layout :: flash-messages}"></div>

<!-- User Info Card -->
<div class="bg-surface-container-lowest rounded-xl p-8 shadow-sm mb-8">
<div class="flex items-center gap-6 mb-8 pb-8 border-b border-outline-variant/20">
<div class="relative group">
<div class="w-20 h-20 rounded-full bg-primary-fixed flex items-center justify-center overflow-hidden">
<img th:if="${user.imageUrl != null}" th:src="${user.imageUrl}" alt="Avatar" class="w-full h-full object-cover"/>
<span th:if="${user.imageUrl == null}" class="material-symbols-outlined text-4xl text-primary">account_circle</span>
</div>
<form th:action="@{/profile/avatar}" method="post" enctype="multipart/form-data" class="absolute inset-0">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
<label class="absolute inset-0 flex items-center justify-center bg-black/50 rounded-full opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer">
<span class="material-symbols-outlined text-white text-2xl">photo_camera</span>
<input type="file" name="avatarFile" accept="image/*" class="hidden" onchange="this.form.submit()"/>
</label>
</form>
</div>
<div>
<h2 class="text-xl font-bold font-headline" th:text="${user.fullName}">User Name</h2>
<p class="text-on-surface-variant text-sm" th:text="${user.email}">email@example.com</p>
<p class="text-on-surface-variant text-xs mt-1">Di chuột vào ảnh để thay đổi</p>
<span th:if="${user.provider != null}" class="inline-flex items-center gap-1 mt-1 px-3 py-1 bg-primary-fixed text-on-primary-fixed-variant text-xs font-bold rounded-full">
<span class="material-symbols-outlined text-sm">link</span>
<span th:text="'Liên kết với ' + ${user.provider}">OAuth</span>
</span>
</div>
</div>

<!-- Profile Update Form -->
<form th:action="@{/profile/update}" th:object="${profileForm}" method="post" class="space-y-6">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

<div class="space-y-2">
<label class="text-xs font-bold uppercase tracking-wider text-on-surface-variant ml-1">Họ và tên</label>
<input th:field="*{fullName}" class="w-full bg-surface-container-high border-none rounded-lg px-5 py-4 focus:ring-2 focus:ring-primary/40 transition-all placeholder:text-outline/50 text-sm" placeholder="Nhập họ tên" type="text"/>
<p th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="text-error text-xs mt-1"></p>
</div>

<div class="space-y-2">
<label class="text-xs font-bold uppercase tracking-wider text-on-surface-variant ml-1">Email</label>
<input th:value="${user.email}" class="w-full bg-surface-container border-none rounded-lg px-5 py-4 text-sm text-on-surface-variant cursor-not-allowed" type="email" disabled/>
<p class="text-xs text-on-surface-variant ml-1">Email không thể thay đổi.</p>
</div>

<div class="space-y-2">
<label class="text-xs font-bold uppercase tracking-wider text-on-surface-variant ml-1">Số điện thoại</label>
<input th:field="*{phone}" class="w-full bg-surface-container-high border-none rounded-lg px-5 py-4 focus:ring-2 focus:ring-primary/40 transition-all placeholder:text-outline/50 text-sm" placeholder="+84 000 000 000" type="tel"/>
<p th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="text-error text-xs mt-1"></p>
</div>

<div class="space-y-2">
<label class="text-xs font-bold uppercase tracking-wider text-on-surface-variant ml-1">Địa chỉ</label>
<textarea th:field="*{address}" class="w-full bg-surface-container-high border-none rounded-lg px-5 py-4 focus:ring-2 focus:ring-primary/40 transition-all placeholder:text-outline/50 text-sm" placeholder="Số nhà, đường, phường/xã, quận/huyện, tỉnh/thành..." rows="3"></textarea>
<p th:if="${#fields.hasErrors('address')}" th:errors="*{address}" class="text-error text-xs mt-1"></p>
</div>

<div class="flex gap-4 pt-4">
<button type="submit" class="px-8 py-4 bg-primary text-on-primary rounded-xl font-bold hover:bg-primary-container transition-all shadow-lg shadow-primary/20">Cập nhật</button>
<a th:href="@{/home}" class="px-8 py-4 border-2 border-outline-variant text-on-surface-variant rounded-xl font-bold hover:bg-surface-container transition-all">Hủy</a>
</div>
</form>
</div>

<!-- Change Password Card -->
<div th:if="${user.password != null}" class="bg-surface-container-lowest rounded-xl p-8 shadow-sm mb-8">
<div class="flex items-center gap-3 mb-6">
<span class="material-symbols-outlined text-2xl text-primary">lock</span>
<h2 class="text-xl font-bold font-headline">Đổi mật khẩu</h2>
</div>

<form th:action="@{/profile/change-password}" th:object="${changePasswordForm}" method="post" class="space-y-6">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

<div class="space-y-2">
<label class="text-xs font-bold uppercase tracking-wider text-on-surface-variant ml-1">Mật khẩu hiện tại</label>
<input th:field="*{currentPassword}" type="password" class="w-full bg-surface-container-high border-none rounded-lg px-5 py-4 focus:ring-2 focus:ring-primary/40 transition-all placeholder:text-outline/50 text-sm" placeholder="Nhập mật khẩu hiện tại"/>
<p th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}" class="text-error text-xs mt-1"></p>
</div>

<div class="space-y-2">
<label class="text-xs font-bold uppercase tracking-wider text-on-surface-variant ml-1">Mật khẩu mới</label>
<input th:field="*{newPassword}" type="password" class="w-full bg-surface-container-high border-none rounded-lg px-5 py-4 focus:ring-2 focus:ring-primary/40 transition-all placeholder:text-outline/50 text-sm" placeholder="Nhập mật khẩu mới (ít nhất 6 ký tự)"/>
<p th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}" class="text-error text-xs mt-1"></p>
</div>

<div class="space-y-2">
<label class="text-xs font-bold uppercase tracking-wider text-on-surface-variant ml-1">Xác nhận mật khẩu mới</label>
<input th:field="*{confirmPassword}" type="password" class="w-full bg-surface-container-high border-none rounded-lg px-5 py-4 focus:ring-2 focus:ring-primary/40 transition-all placeholder:text-outline/50 text-sm" placeholder="Nhập lại mật khẩu mới"/>
<p th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="text-error text-xs mt-1"></p>
</div>

<div class="pt-4">
<button type="submit" class="px-8 py-4 bg-primary text-on-primary rounded-xl font-bold hover:bg-primary-container transition-all shadow-lg shadow-primary/20">Đổi mật khẩu</button>
</div>
</form>
</div>

<!-- Quick Links -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<a th:href="@{/orders}" class="flex items-center gap-4 p-6 bg-surface-container-lowest rounded-xl shadow-sm hover:shadow-md transition-all group">
<span class="material-symbols-outlined text-3xl text-primary group-hover:scale-110 transition-transform">receipt_long</span>
<div>
<h3 class="font-bold">Đơn hàng của tôi</h3>
<p class="text-sm text-on-surface-variant">Xem lịch sử đơn hàng</p>
</div>
</a>
<a th:href="@{/cart}" class="flex items-center gap-4 p-6 bg-surface-container-lowest rounded-xl shadow-sm hover:shadow-md transition-all group">
<span class="material-symbols-outlined text-3xl text-primary group-hover:scale-110 transition-transform">shopping_cart</span>
<div>
<h3 class="font-bold">Giỏ hàng</h3>
<p class="text-sm text-on-surface-variant">Xem giỏ hàng hiện tại</p>
</div>
</a>
</div>
</div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
